<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#287fb3">
  <meta name="description" content="A quiet place for your messages to land. An ambient telephone-wire study with sample emails, agent conversations and documents.">
  <title>Murmuration · On the wires</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/sky-photo.png" as="image">
  <link rel="stylesheet" href="/src/wires.css">
  <script type="module" src="/src/wires-main.js"></script>
</head>
<body>
  <main>
    <canvas id="wires" aria-label="Birds on three telephone wires, representing sample emails, agent conversations and other items. Choose an item below or select a bird."></canvas>
    <header class="top">
      <div class="identity">
        <p class="eyebrow">Murmuration <span>/ 003</span></p>
        <h1>On the wires.</h1>
        <p class="intro">A quiet place for your messages to land.</p>
      </div>
      <div class="top-controls">
        <div class="scene-switch" role="group" aria-label="Scene">
          <button type="button" id="scene-wires" aria-pressed="true">Wires</button>
          <button type="button" id="scene-sky" aria-pressed="false">Sky</button>
        </div>
        <button type="button" id="pause" class="quiet-button" aria-pressed="false">Pause</button>
      </div>
    </header>
    <aside class="scene-note" aria-label="Scene description"><span id="scene-caption">Email, agents, and everything else.</span><span id="scene-detail">Each bird keeps its own place.</span></aside>
    <section class="dock" aria-label="Sample communications">
      <div class="activity-line">
        <div class="activity-summary"><span class="sample-dot" aria-hidden="true"></span><span id="summary">17 sample items</span><span class="sample-label">No accounts connected</span></div>
        <p id="overflow" hidden></p>
        <span id="play-state">A little room to breathe</span>
      </div>
      <p id="notice" role="status" aria-live="polite"></p>
      <div class="sample-controls">
        <div class="source-counts" aria-label="Items by wire">
          <button type="button" data-lane="email"><span>Email</span><strong id="count-email">8</strong></button>
          <button type="button" data-lane="agents"><span>Agents</span><strong id="count-agents">5</strong></button>
          <button type="button" data-lane="other"><span>Other</span><strong id="count-other">4</strong></button>
        </div>
        <div class="arrivals" aria-label="Try sample activity">
          <button type="button" id="new-email" class="outlined">New email <span aria-hidden="true">↗</span></button>
          <button type="button" id="agent-reply">Agent reply</button>
          <button type="button" id="replay">Play sequence</button>
          <button type="button" id="reset">Reset</button>
        </div>
      </div>
      <div class="item-controls">
        <label for="selected-item">Selected bird</label>
        <select id="selected-item" aria-describedby="selected-state"></select>
        <span id="selected-state">Unread email</span>
        <div class="item-actions"><button type="button" id="read">Mark read</button><button type="button" id="archive">Archive</button></div>
      </div>
      <footer>
        <span>Adapted from <a href="https://benbashford.com/experiments/murmuration/murmuration.html" target="_blank" rel="noopener noreferrer">Ben Bashford’s experiment <span aria-hidden="true">↗</span></a></span>
        <a href="/classic.html">Original flock study <span aria-hidden="true">↗</span></a>
      </footer>
    </section>
    <p id="error" class="error" role="alert" hidden></p>
    <noscript><p class="error">Enable JavaScript to see the birds and try the sample activity.</p></noscript>
  </main>
</body>
</html>
